plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    // Copied into the AppleSkin run directory, not onto the shared runtime classpath.
    appleSkinRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Copied into the Croptopia run, together with EpheroLib. Empty when this version has no build.
    croptopiaRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def appleSkinMods = layout.projectDirectory.dir('runs/client-appleskin/mods')
tasks.register('syncAppleSkin', Sync) {
    from(configurations.appleSkinRuntime)
    into(appleSkinMods)
}

def croptopiaMods = layout.projectDirectory.dir('runs/client-croptopia/mods')
tasks.register('syncCroptopia', Sync) {
    from(configurations.croptopiaRuntime)
    into(croptopiaMods)
}

def croptopia = findProperty('croptopia_file') ?: ''
def epherolib = findProperty('epherolib_file') ?: ''

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    appleSkinRuntime "maven.modrinth:appleskin:${appleskin_version}"
    if (croptopia && epherolib) {
        croptopiaRuntime "curse.maven:croptopia-415438:${croptopia}"
        croptopiaRuntime "curse.maven:epherolib-885449:${epherolib}"
    }

    // Dev runs only. Loom's localRuntime is not on the compile classpath and is not published.
    // Minecraft 26.3 is unobfuscated, so there is no modLocalRuntime configuration.
    localRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api'
    }
    compileOnly "maven.modrinth:jade:${jade_version}+fabric"
    localRuntime "maven.modrinth:jade:${jade_version}+fabric"
}

loom {
    def aw = rootProject.file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        configureEach {
            property('feast_dominion.add_debug_commands', 'true')
        }
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            programArgs '--width', '1920', '--height', '1080'
            runDir('runs/client')
        }
        clientAppleSkin {
            client()
            setConfigName('Fabric Client AppleSkin')
            ideConfigGenerated(true)
            programArgs '--width', '1920', '--height', '1080'
            runDir('runs/client-appleskin')
        }
        if (croptopia && epherolib) {
            clientCroptopia {
                client()
                setConfigName('Fabric Client Croptopia')
                ideConfigGenerated(true)
                programArgs '--width', '1920', '--height', '1080'
                runDir('runs/client-croptopia')
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gametest {
            server()
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml")
            runDir('runs/gametest')
        }
        clientGametest {
            client()
            setConfigName('Fabric Client Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric.client.gametest')
            programArgs '--width', '1920', '--height', '1080'
            runDir('runs/clientGametest')
        }
    }
}

tasks.named('runClientAppleSkin') {
    dependsOn tasks.named('syncAppleSkin')
}

if (croptopia && epherolib) {
    tasks.named('runClientCroptopia') {
        dependsOn tasks.named('syncCroptopia')
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
