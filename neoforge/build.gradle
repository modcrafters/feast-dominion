plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

// On the dev runtime classpath only. Not compiled against and not published.
configurations {
    localRuntime {
        canBeConsumed = false
        canBeResolved = false
    }
    // Copied into the AppleSkin run directory. Not on the shared runtime classpath, so the
    // plain client run stays without it.
    appleSkinRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Copied into the Spice of Life runs. Not on the shared runtime classpath, so the
    // plain client run stays without it.
    solCarrotRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Copied into the Farmer's Delight runs. Empty on versions that have no build.
    delightRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
configurations.named('runtimeClasspath') {
    extendsFrom(configurations.localRuntime)
}

def appleSkinMods = layout.projectDirectory.dir('runs/client-appleskin/mods')
tasks.register('syncAppleSkin', Sync) {
    from(configurations.appleSkinRuntime)
    into(appleSkinMods)
}

def solCarrotMods = layout.projectDirectory.dir('runs/client-solcarrot/mods')
tasks.register('syncSolCarrot', Sync) {
    from(configurations.solCarrotRuntime)
    into(solCarrotMods)
}

def delightMods = layout.projectDirectory.dir('runs/client-delight/mods')
tasks.register('syncDelight', Sync) {
    from(configurations.delightRuntime)
    into(delightMods)
}

def integrationMods = layout.projectDirectory.dir('runs/client-integrations/mods')
tasks.register('syncIntegrations', Sync) {
    from(configurations.appleSkinRuntime, configurations.solCarrotRuntime, configurations.delightRuntime)
    into(integrationMods)
}

def farmersDelight = findProperty('farmersdelight_version') ?: ''

dependencies {
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}+neoforge"
    localRuntime "maven.modrinth:jade:${jade_version}+neoforge"
    appleSkinRuntime "maven.modrinth:appleskin:${appleskin_version}"
    solCarrotRuntime "curse.maven:spice-of-life-carrot-edition-277616:${solcarrot_file}"
    if (farmersDelight) {
        delightRuntime "maven.modrinth:farmers-delight:${farmersDelight}"
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            systemProperty('feast_dominion.add_debug_commands', 'true')
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            programArguments.addAll '--width', '1920', '--height', '1080'
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        clientAppleSkin {
            client()
            programArguments.addAll '--width', '1920', '--height', '1080'
            gameDirectory = this.mkdir(this.file('runs/client-appleskin'))
            taskBefore tasks.named('syncAppleSkin')
        }
        clientSolCarrot {
            client()
            programArguments.addAll '--width', '1920', '--height', '1080'
            gameDirectory = this.mkdir(this.file('runs/client-solcarrot'))
            taskBefore tasks.named('syncSolCarrot')
        }
        clientIntegrations {
            client()
            programArguments.addAll '--width', '1920', '--height', '1080'
            gameDirectory = this.mkdir(this.file('runs/client-integrations'))
            taskBefore tasks.named('syncIntegrations')
        }
        if (farmersDelight) {
            clientDelight {
                client()
                programArguments.addAll '--width', '1920', '--height', '1080'
                gameDirectory = this.mkdir(this.file('runs/client-delight'))
                taskBefore tasks.named('syncDelight')
            }
        }
        data {
            // clientData() since 1.21.4, data() before (neoforge_data_run in each version's gradle.properties).
            "${neoforge_data_run}"()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = this.mkdir(this.file('runs/gametest'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// IntelliJ's Application run takes its JVM from the module, which inherits the
// project JDK (21). 26.3's dev VM args include a flag that JVM rejects, so that
// button never starts. This run is a Gradle task instead, on the Java toolchain.
def delightRuns = ['clientAppleSkin', 'clientSolCarrot', 'clientIntegrations']
if (farmersDelight) {
    delightRuns.add('clientDelight')
}
delightRuns.each { runName ->
    neoForge.runs.named(runName) {
        if (java_version.toInteger() >= 25) {
            disableIdeRun()
        }
    }
}
if (java_version.toInteger() >= 25) {
    def gameLauncher = javaToolchains.launcherFor {
        languageVersion.set(org.gradle.jvm.toolchain.JavaLanguageVersion.of(java_version.toInteger()))
    }
    def delightTasks = ['runClientAppleSkin', 'runClientSolCarrot', 'runClientIntegrations']
    if (farmersDelight) {
        delightTasks.add('runClientDelight')
    }
    delightTasks.each { taskName ->
        tasks.named(taskName) {
            javaLauncher.set(gameLauncher)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
